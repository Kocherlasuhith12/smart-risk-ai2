services:
  # Backend API service
  - type: web
    name: smart-risk-ai-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      python3 ml/generate_dataset.py
      python3 ml/train_model.py
    startCommand: |
      export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
      cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-risk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

  # Frontend static service
  - type: web
    name: smart-risk-ai-frontend
    runtime: static
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smart-risk-ai-backend
          type: web
          property: host

databases:
  - name: smart-risk-db
    plan: free
